name: Deploy

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

jobs:
  hooks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      # 周更部署前先用上游最新数据做一次体检，避免把异常数据发布出去
      - name: Data check (remote)
        run: pnpm check:data --remote

      - name: Trigger Vercel deployment
        env:
          VERCEL_WEB_HOOK: ${{ secrets.VERCEL_WEB_HOOK }}
        run: |
          set -euo pipefail
          echo "Automatic deployment every Sunday."
          curl -fsS -X POST "$VERCEL_WEB_HOOK"
          echo "Done."
