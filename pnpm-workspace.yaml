minimumReleaseAgeExcludePrune: true

trustPolicy: no-downgrade
trustPolicyExclude:
  - cached-factory
  - chokidar
  - nanoid
  - '@vercel/functions'
  - '@vercel/routing-utils'
  - '@vercel/oidc'
  - '@vercel/cli-config'
  - '@vercel/cli-exec'

shellEmulator: true

overrides:
  brace-expansion: '>=5.0.12'
  fast-uri: '>=4.2.1'
  path-to-regexp: '>=8.4.2'
  postcss: '>=8.5.28'
  svgo: '>=4.1.0'
  tar: '>=7.5.22'

allowBuilds:
  esbuild: true
  sharp: true
