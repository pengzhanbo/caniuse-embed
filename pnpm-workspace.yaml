shellEmulator: true
trustPolicy: no-downgrade
trustPolicyExclude:
  - cached-factory
  - chokidar
  - nanoid

allowBuilds:
  esbuild: true
  sharp: true

overrides:
  brace-expansion: '>=5.0.8'
  fast-uri: '>=3.1.4'
  path-to-regexp: '>=6.3.0'
  postcss: '>=8.5.18'
  svgo: '>=4.0.2'
  tar: '>=7.5.21'
