shellEmulator: true
trustPolicy: no-downgrade
trustPolicyExclude:
  - cached-factory
  - chokidar
  - nanoid

allowBuilds:
  esbuild: true
  sharp: true

overrides:
  brace-expansion: '>=5.0.9'
  fast-uri: '>=4.1.3'
  path-to-regexp: '>=8.4.2'
  postcss: '>=8.5.26'
  svgo: '>=4.1.0'
  tar: '>=7.5.22'
