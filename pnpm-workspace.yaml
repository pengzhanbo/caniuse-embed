minimumReleaseAgeExcludePrune: true

trustPolicy: no-downgrade
trustPolicyExclude:
  - cached-factory
  - chokidar
  - nanoid

shellEmulator: true

overrides:
  brace-expansion: '>=5.1.0'
  fast-uri: '>=4.2.4'
  path-to-regexp: '>=9.0.0'
  postcss: '>=8.5.33'
  svgo: '>=4.1.0'
  tar: '>=7.5.23'

allowBuilds:
  esbuild: true
  sharp: true
